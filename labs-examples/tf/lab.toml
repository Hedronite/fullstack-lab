# Example: Terraform plus a Go terratest test. Not graded. Format: docs/lab-toml.md
schema = "hedronite.lab/v1"

[lab]
id = "example-tf"
title = "Terraform and terratest hello world"
kind = "example"
family = "terraform"
source = "labs-examples/tf"
readme = "README.md"

[grade]
# The student runs `go test` by hand; `go mod tidy` and `terraform init` fetch from the network.
backend = "manual"
network = "egress"

[tools]
terraform = ">= 1.9.0"
go = "*"

[[tf_providers]]
source = "hashicorp/local"
version = "~> 2.5"
