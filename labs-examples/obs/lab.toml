# Example: Prometheus and Grafana, in the container and as a Helm chart. Not graded.
# Format: docs/lab-toml.md
schema = "hedronite.lab/v1"

[lab]
id = "example-obs"
title = "Observability: Prometheus and Grafana, two ways"
kind = "example"
family = "observability"
source = "labs-examples/obs"
readme = "README.md"

[grade]
backend = "manual"
network = "egress"

[tools]
prometheus = "*"
grafana = "*"
helm = "*"
kubectl = "*"
tmux = "*"

[mounts]
# cluster mode installs a Helm chart on a real cluster; nothing else is mounted.
creds = ["kube"]
